<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de Encomiendas Lapticon</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Portal de Encomiendas Lapticon</h1>

    <section id="login-section" class="card">
      <h2>Iniciar sesión</h2>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Correo" value="test30@gmail.com" required />
        <input type="password" id="login-password" placeholder="Contraseña" required />
        <button type="submit" id="login-btn">Ingresar</button>
      </form>
      <p id="login-status" class="status"></p>
    </section>

    <section id="app-section" hidden>
      <div class="card welcome">
        <p id="welcome-message"></p>
      </div>

      <div class="card">
        <h2>Registrar encomienda</h2>

        <div class="grid">
          <label>
            Ciudad de origen
            <select id="origen-select"></select>
          </label>
          <label>
            Ciudad de destino
            <select id="destino-select"></select>
          </label>
        </div>
        <p id="ciudades-status" class="status"></p>

        <form id="encomienda-form">
          <div class="grid">
            <label>
              Valor
              <input type="text" id="valor-input" placeholder="Ej: 50000" inputmode="decimal" required />
            </label>
            <label>
              Moneda
              <select id="moneda-select">
                <option value="USD">USD</option>
                <option value="COP">COP</option>
              </select>
            </label>
          </div>
          <label>
            Observaciones
            <input type="text" id="observaciones-input" placeholder="Ej: Documentos, frágil..." />
          </label>
          <button type="submit" id="encomienda-btn">Crear encomienda</button>
        </form>
        <p id="encomienda-status" class="status"></p>
      </div>

      <div class="card">
        <div class="card-header">
          <h2>Mis encomiendas</h2>
          <button type="button" id="refrescar-btn" class="secondary">Actualizar</button>
        </div>
        <div class="table-wrap">
          <table id="encomiendas-table">
            <thead>
              <tr><th>Origen</th><th>Destino</th><th>Estado</th><th>Valor</th><th></th></tr>
            </thead>
            <tbody id="encomiendas-body"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
